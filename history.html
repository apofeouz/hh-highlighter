<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>История просмотров — HH Highlighter</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#0a0908;color:#f1f5f9;min-height:100vh}
.wrap{max-width:780px;margin:0 auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.header{display:flex;align-items:center;gap:14px;padding-bottom:14px;border-bottom:1px solid #1e293b;flex-wrap:wrap}
.header img{width:40px;height:40px;border-radius:10px}
h1{font-size:18px}
.sub{font-size:12px;color:#94a3b8}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:#11161d;border:1px solid #1e293b;border-radius:12px;padding:12px}
.controls input{flex:1;min-width:180px;background:#0f172a;border:1px solid #334155;color:#f1f5f9;border-radius:8px;padding:8px 12px;font-size:13px}
.btn{padding:8px 14px;border-radius:8px;font-size:12px;font-weight:600;border:1px solid transparent;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.danger{background:#1e293b;color:#fecaca;border-color:#7f1d1d}
.btn.danger:hover{background:#7f1d1d;color:#fff}
.btn.secondary{background:#1e293b;color:#e2e8f0;border-color:#334155}
.btn.secondary:hover{background:#334155}
.count{font-size:12px;color:#94a3b8;margin-left:auto}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:12px;align-items:flex-start;background:#11161d;border:1px solid #1e293b;border-radius:10px;padding:12px;transition:border-color .15s}
.item:hover{border-color:#334155}
.item .meta{flex:1;min-width:0}
.item a{color:#38bdf8;text-decoration:none;font-weight:600;font-size:13px;word-break:break-word}
.item a:hover{text-decoration:underline}
.item .url{font-size:11px;color:#64748b;word-break:break-all;margin-top:2px}
.item .date{font-size:11px;color:#94a3b8;white-space:nowrap}
.item .del{background:none;border:1px solid #334155;color:#94a3b8;border-radius:6px;padding:4px 8px;cursor:pointer;font-size:11px}
.item .del:hover{background:#7f1d1d;color:#fff;border-color:#7f1d1d}
.empty{text-align:center;padding:40px;color:#64748b;font-size:13px;border:1px dashed #334155;border-radius:12px;background:#0f172a}
.footer{text-align:center;font-size:11px;color:#475569;padding:10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <img src="icon/icon_styled_48.png" alt="">
    <div>
      <h1>История просмотров hh.ru</h1>
      <div class="sub" id="subtitle">Загрузка...</div>
    </div>
  </div>

  <div class="controls">
    <input id="search" placeholder="Поиск по названию, ID или ссылке...">
    <span class="count" id="count"></span>
    <button id="clearAll" class="btn danger">Очистить всё</button>
    <a href="https://hh.ru/search/vacancy" target="_blank" class="btn secondary">На hh.ru →</a>
  </div>

  <div id="list" class="list"></div>
  <div class="footer">Данные хранятся только в вашем браузере. <a href="https://github.com/apofeouz/hh-highlighter" target="_blank" style="color:#38bdf8">GitHub</a></div>
</div>
<script src="history.js"></script>
</body>
</html>
